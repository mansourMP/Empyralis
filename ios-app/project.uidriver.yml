# TEMPORARY spec used only by the live-verification harness. It INCLUDES the
# real project.yml and adds a UI-test target that drives the app on a
# simulator. project.yml itself is untouched; regenerate from it to get the
# canonical project back.
include:
  - project.yml

targets:
  UIDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UIDriver
    dependencies:
      - target: Empyralis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.empyralis.app.uidriver
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Empyralis

schemes:
  UIDriver:
    build:
      targets:
        UIDriver: [test]
    test:
      targets: [UIDriver]
