name: Empyralis
options:
  bundleIdPrefix: ai.empyralis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Read from the signing certificate installed on this Mac — specifically
    # its Organizational Unit, which is what Apple defines as the Team ID.
    #   security find-certificate -c "Apple Development: <apple-id>" -p \
    #     | openssl x509 -noout -subject
    # NOT the value in parentheses in the certificate's common name — that is
    # the certificate's own id (AP284MTHFQ here) and using it produces a
    # signing failure whose message never mentions the team.
    DEVELOPMENT_TEAM: LYUMASNB36
    CODE_SIGN_STYLE: Automatic

targets:
  Empyralis:
    type: application
    platform: iOS
    sources:
      - path: Empyralis
    info:
      path: Empyralis/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Empyralis
        # ── Orientation ──────────────────────────────────────────────────
        # PORTRAIT ONLY, and this is a fix, not a default that was left
        # alone: this key was ABSENT until 2026-08-26, and an absent key is
        # NOT the same as portrait-locked — iOS's own fallback with nothing
        # declared is to allow every orientation. Rotating a real build
        # confirmed it: the frame genuinely rotates (a screenshot taken
        # after `XCUIDevice.shared.orientation = .landscapeLeft` measures
        # 874x402, wider than tall), but nothing in this app's layout code
        # is orientation-aware — zero hits for "orientation" anywhere in
        # `Empyralis/` before this change — so what actually renders is the
        # portrait interface with its coordinate space rotated: title and
        # buttons legible only with the phone turned on its side, not a
        # reflowed landscape layout. That is a broken screen, not a design
        # choice nobody happened to make yet, and every screen in this app
        # (Theme.swift's own "operator-tool density" type scale, dense
        # single-column lists) is built for a fixed portrait width — so
        # portrait-only is the correct fix, matching this app's actual
        # density, not a workaround.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ── Sign in with Google ────────────────────────────────────────
        # EMPTY ON PURPOSE, and the empty string is what keeps the button
        # off the login screen (GoogleAuthConfig.clientId treats blank as
        # absent; LoginView renders nothing at all rather than a control
        # that could only fail).
        #
        # To turn it on, BOTH of these must be filled in with the SAME
        # Google **iOS** OAuth client id, and `GOOGLE_IOS_CLIENT_ID` must
        # be set to it on the backend — see ios-app/README.md.
        #
        #   EmpyralisGoogleClientID: 1234-abcd.apps.googleusercontent.com
        #   CFBundleURLSchemes:    [com.googleusercontent.apps.1234-abcd]
        #                          ^ the client id's parts reversed. Google
        #                            calls this the reversed client id and
        #                            accepts no other scheme for an iOS
        #                            client.
        #
        # This belongs HERE and never in Empyralis/Info.plist, which is
        # GENERATED — an edit there is erased by the next `xcodegen
        # generate`, silently.
        EmpyralisGoogleClientID: ""
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ai.empyralis.app.google-oauth
            CFBundleURLSchemes: []
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: false
          # A DEBUG build talks to a disposable stack on 127.0.0.1 over
          # cleartext (see APIConfig). ATS blocks that by default and the
          # failure surfaces as a generic "could not connect", naming
          # nothing — so the exception is scoped to loopback ONLY. Every
          # other host, production included, still requires TLS.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Empyralis/Empyralis.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.empyralis.app
        # The asset catalog (added for the Google mark) carries no AppIcon
        # set, and `actool` fails the whole build looking for one the moment
        # ANY catalog exists — this app has never shipped an icon asset, so
        # the empty name preserves exactly the state it was already in
        # rather than quietly introducing an icon requirement. Give this a
        # real value the day an icon set lands.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false

  EmpyralisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpyralisTests
    dependencies:
      - target: Empyralis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.empyralis.app.tests
        GENERATE_INFOPLIST_FILE: true
