name: Empyralis
options:
  bundleIdPrefix: ai.empyralis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Empyralis:
    type: application
    platform: iOS
    sources:
      - path: Empyralis
    info:
      path: Empyralis/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Empyralis
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Empyralis/Empyralis.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.empyralis.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false

  EmpyralisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpyralisTests
    dependencies:
      - target: Empyralis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.empyralis.app.tests
        GENERATE_INFOPLIST_FILE: true
