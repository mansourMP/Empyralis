name: Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan current tree for secrets
        run: |
          set +e
          gitleaks dir \
            --redact \
            --exit-code=2 \
            --no-banner \
            --config .gitleaks.toml \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            .
          status=$?
          if [ -s /tmp/gitleaks-report.json ]; then
            jq -r '.[] | "\(.File):\(.StartLine) \(.RuleID)"' /tmp/gitleaks-report.json
          fi
          exit "$status"

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python requirements
        run: pip-audit -r requirements.txt -r requirements-worker.txt

  node-dependency-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high --omit=dev

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --ignore-scripts

      - name: Audit mobile dependencies
        run: npm audit --prefix mobile --audit-level=high --omit=dev
