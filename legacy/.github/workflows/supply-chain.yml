name: Supply Chain Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/empyralis-repo.cdx.json
          upload-artifact: false

      - name: Attest SBOM provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/empyralis-repo.cdx.json
