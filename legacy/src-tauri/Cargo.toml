[package]
name = "empyralis-tauri-shell"
version = "0.1.0"
description = "Tauri shell for the Empyralis Next.js app"
authors = ["Empyralis"]
edition = "2021"

[lib]
name = "empyralis_tauri_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-updater = "2"
ureq = "3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSWindowRestoration"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSUserDefaults"] }
