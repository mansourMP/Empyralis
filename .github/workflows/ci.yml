name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-worker.txt pytest

      - name: Build Rust runtime kernel
        run: cargo build --manifest-path empyralis-runtime-kernel/Cargo.toml

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run demo-critical server test suite
        run: |
          python -m pytest \
            server_modules/tests/test_auth.py \
            server_modules/tests/test_auth_account_shell.py \
            server_modules/tests/test_auth_cookie_sessions.py \
            server_modules/tests/test_auth_hardening.py \
            server_modules/tests/test_direct_chat_availability_service.py \
            server_modules/tests/test_direct_chat_entry_service.py \
            server_modules/tests/test_direct_chat_generation_service.py \
            server_modules/tests/test_direct_chat_provider_service.py \
            server_modules/tests/test_direct_chat_stream_response_service.py \
            server_modules/tests/test_direct_chat_tool_catalog_service.py \
            server_modules/tests/test_exception_and_task_lint.py \
            server_modules/tests/test_gateway_execution_service.py \
            server_modules/tests/test_gateway_health_service.py \
            server_modules/tests/test_gateway_routes.py \
            server_modules/tests/test_outcome_honesty_lint.py \
            server_modules/tests/test_provider_catalog_service.py \
            server_modules/tests/test_provider_catalog_truth.py \
            server_modules/tests/test_provider_credential_flows.py \
            server_modules/tests/test_provider_profiles.py \
            server_modules/tests/test_runtime_runs_api_chat_stream.py \
            server_modules/tests/test_vault_store.py \
            server_modules/tests/test_workspace_bootstrap_service.py

  shell-typecheck:
    name: Frontend and gateway typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install gateway dependencies
        run: npm ci --prefix empyralis-gateway

      - name: Typecheck frontend
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: frontend

      - name: Typecheck gateway
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit
        working-directory: empyralis-gateway

  # ARCHIVED (Phase U1): supervisor-build job removed.
  # The Rust empyralis-supervisor daemon is no longer part of the Empyralis product.
  # Desktop control (mouse/keyboard/screen/fs) is OUT of scope.
