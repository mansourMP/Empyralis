# Reproduces a REAL customer provision — bare Ubuntu + the exact cloud-init
# user_data production generates + the installer served from R2 — on a droplet
# we can actually SSH into.
#
# WHY THIS EXISTS: every provision through the platform fails at the 20-minute
# timeout having reported NOTHING. Not one of the 18 provisions in production
# history recorded an install_phase, and the installer has a failure trap — if
# it ran and died anywhere, it would have beaconed. Zero beacons across 18
# attempts points at the installer never running at all, which means the
# suspect is cloud-init, not the install.
#
# That path has never been tested. The existing e2e-agent-computer-connect
# test boots the BAKED image and runs empyralis-configure over SSH — it proves
# the gateway connects (65s), but it deliberately skips cloud-init and skips
# the installer. This fills exactly that gap.
#
# Deliberately uses a FAKE pairing token by default: the question here is "does
# cloud-init run the installer, and does the installer get through apt + Node +
# the artifact download", all of which happen before registration. A fake token
# fails at the final registration step only, which is a perfectly good outcome —
# it means everything upstream worked. Pass a real one to test the whole chain.
name: E2E Cloud-init Install (real provisioning path)

on:
  workflow_dispatch:
    inputs:
      pairing_token:
        description: 'Real pairing token to test the FULL chain. Blank = fake token; the install is still fully exercised and only registration fails.'
        required: false
        default: ''
      region:
        description: 'Region to boot in.'
        required: false
        default: 'nyc3'
      size:
        description: 'Droplet size. Match what the platform actually provisions.'
        required: false
        default: 's-1vcpu-2gb'
      settle_seconds:
        description: 'How long to let cloud-init run before inspecting.'
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  cloud-init-install:
    name: Boot bare Ubuntu, run the real cloud-init, inspect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_API: https://api.digitalocean.com/v2
      API_URL: https://empyralis.ai/api
      REGION: ${{ inputs.region }}
      SIZE: ${{ inputs.size }}
      BASE_IMAGE: ubuntu-24-04-x64
      DROPLET_NAME: empyralis-e2e-cloudinit-${{ github.run_id }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=10
    steps:
      - name: Fail early if the DigitalOcean token is missing
        run: |
          set -euo pipefail
          [ -n "${DO_TOKEN:-}" ] || { echo "::error::DIGITALOCEAN_ACCESS_TOKEN is not set."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Generated by the SAME function the platform calls, so this tests what
      # production actually emits rather than a hand-copied approximation. If
      # cloud_init_script ever changes, this test changes with it for free.
      - name: Generate the EXACT cloud-init production would send
        id: userdata
        env:
          PAIRING_TOKEN_INPUT: ${{ inputs.pairing_token }}
        run: |
          set -euo pipefail
          TOKEN="${PAIRING_TOKEN_INPUT}"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "using the supplied real pairing token (full chain incl. registration)"
            echo "real_token=true" >> "$GITHUB_OUTPUT"
          else
            TOKEN="gpair_e2e_cloudinit_fake_${{ github.run_id }}"
            echo "using a FAKE pairing token — install is fully exercised; only registration will fail"
            echo "real_token=false" >> "$GITHUB_OUTPUT"
          fi
          EMPYRALIS_PUBLIC_API_URL="$API_URL" PAIRING_TOKEN="$TOKEN" python - <<'PY' > /tmp/user_data.yaml
          import os, sys
          sys.path.insert(0, os.getcwd())
          from server_modules import vps_provisioning_service as vps
          sys.stdout.write(vps.cloud_init_script(os.environ["PAIRING_TOKEN"]))
          PY
          echo "--- generated user_data (token redacted) ---"
          sed -E "s/gpair_[A-Za-z0-9_-]+/gpair_[REDACTED]/g" /tmp/user_data.yaml
          python -c "import yaml,sys; d=yaml.safe_load(open('/tmp/user_data.yaml')); print('YAML OK, runcmd entries:', len(d.get('runcmd') or []))"

      - name: Create a throwaway SSH key
        id: sshkey
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -N '' -C "empyralis-e2e-cloudinit-$GITHUB_RUN_ID" -f /tmp/k >/dev/null
          RESP="$(curl -fsS -X POST "$DO_API/account/keys" \
            -H "Authorization: Bearer $DO_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg name "empyralis-e2e-cloudinit-$GITHUB_RUN_ID" --arg key "$(cat /tmp/k.pub)" '{name:$name, public_key:$key}')")"
          ID="$(printf '%s' "$RESP" | jq -r '.ssh_key.id')"
          case "$ID" in ''|null) echo "::error::could not register the temporary SSH key"; exit 1 ;; esac
          echo "key_id=$ID" >> "$GITHUB_OUTPUT"

      # Bare Ubuntu, NOT the baked image — this is the path customers get.
      - name: Create the droplet with the real cloud-init
        id: droplet
        run: |
          set -euo pipefail
          BODY="$(jq -n \
            --arg name "$DROPLET_NAME" --arg region "$REGION" --arg size "$SIZE" \
            --arg image "$BASE_IMAGE" --rawfile ud /tmp/user_data.yaml \
            --argjson keys "[${{ steps.sshkey.outputs.key_id }}]" \
            '{name:$name, region:$region, size:$size, image:$image, user_data:$ud,
              ssh_keys:$keys, backups:false, ipv6:false, monitoring:false}')"
          RESP="$(curl -fsS -X POST "$DO_API/droplets" -H "Authorization: Bearer $DO_TOKEN" \
            -H 'Content-Type: application/json' -d "$BODY")"
          ID="$(printf '%s' "$RESP" | jq -r '.droplet.id')"
          case "$ID" in ''|null) echo "::error::droplet create failed"; printf '%s' "$RESP" >&2; exit 1 ;; esac
          echo "droplet_id=$ID" >> "$GITHUB_OUTPUT"
          date +%s > /tmp/t0
          echo "droplet $ID created"

      - name: Wait for SSH
        id: ssh
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            RESP="$(curl -fsS -H "Authorization: Bearer $DO_TOKEN" "$DO_API/droplets/${{ steps.droplet.outputs.droplet_id }}")"
            IP="$(printf '%s' "$RESP" | jq -r '[.droplet.networks.v4[]? | select(.type=="public") | .ip_address] | first // ""')"
            if [ -n "$IP" ] && ssh $SSH_OPTS -i /tmp/k root@"$IP" true 2>/dev/null; then
              echo "$IP" > /tmp/ip
              echo "ip=$IP" >> "$GITHUB_OUTPUT"
              echo "SSH ready $(( $(date +%s) - $(cat /tmp/t0) ))s after create"
              exit 0
            fi
            sleep 5
          done
          echo "::error::SSH never came up"; exit 1

      # THE question: did cloud-init run our script, and how far did it get?
      - name: Watch cloud-init actually run the installer
        run: |
          set -uo pipefail
          IP="$(cat /tmp/ip)"
          DEADLINE=$(( $(date +%s) + ${{ inputs.settle_seconds }} ))
          LAST=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            SNAP="$(ssh $SSH_OPTS -i /tmp/k root@"$IP" '
              printf "cloudinit=%s " "$(cloud-init status 2>/dev/null | head -1 | tr -d "\n")"
              printf "bootstrap=%s " "$([ -f /tmp/empyralis-bootstrap.sh ] && echo yes || echo NO)"
              printf "installer=%s " "$([ -s /tmp/empyralis-agent-computer-installer.sh ] && echo yes || echo NO)"
              printf "node=%s " "$(command -v node >/dev/null && node --version || echo NO)"
              printf "gateway_unit=%s " "$([ -f /etc/systemd/system/empyralis-gateway.service ] && echo yes || echo NO)"
              printf "svc=%s" "$(systemctl is-active empyralis-gateway 2>/dev/null || echo inactive)"
            ' 2>/dev/null)"
            if [ "$SNAP" != "$LAST" ]; then
              echo "[$(( $(date +%s) - $(cat /tmp/t0) ))s] $SNAP"
              LAST="$SNAP"
            fi
            case "$SNAP" in *"svc=active"*) echo "gateway service is ACTIVE"; break ;; esac
            sleep 15
          done

      - name: Full diagnostics from the box
        if: always()
        run: |
          set -uo pipefail
          IP="$(cat /tmp/ip 2>/dev/null || true)"
          [ -n "$IP" ] || { echo "no droplet ip; nothing to collect"; exit 0; }
          ssh $SSH_OPTS -i /tmp/k root@"$IP" 'bash -s' <<'REMOTE' > /tmp/diag.txt 2>&1 || true
          echo "===== cloud-init status ====="
          cloud-init status --long 2>&1 | head -20
          echo; echo "===== did our runcmd produce the bootstrap? ====="
          ls -l /tmp/empyralis-bootstrap.sh /tmp/empyralis-agent-computer-installer.sh 2>&1
          echo; echo "===== cloud-init-output.log (tail 120) ====="
          tail -120 /var/log/cloud-init-output.log 2>&1
          echo; echo "===== curl error log, if the download failed ====="
          cat /tmp/empyralis-curl-err.log 2>/dev/null || echo "(none)"
          echo; echo "===== gateway service ====="
          systemctl status empyralis-gateway --no-pager 2>&1 | head -20
          echo; echo "===== journalctl -u empyralis-gateway (tail 60) ====="
          journalctl -u empyralis-gateway --no-pager -n 60 2>&1
          echo; echo "===== env file KEY NAMES only ====="
          [ -f /etc/empyralis/agent-computer.env ] && cut -d= -f1 /etc/empyralis/agent-computer.env || echo "(no env file)"
          echo; echo "===== gateway state dir ====="
          ls -la /var/lib/empyralis/agent-computer/gateway/ 2>&1
          REMOTE
          # Never let a token reach the log.
          sed -E 's/(gpair_|ggt_)[A-Za-z0-9_-]+/\1[REDACTED]/g' /tmp/diag.txt | tee /tmp/diag_clean.txt
          { echo "## Cloud-init install diagnostics"; echo '```'; head -200 /tmp/diag_clean.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy the droplet and the temporary key
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${{ steps.droplet.outputs.droplet_id }}" ]; then
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
              "$DO_API/droplets/${{ steps.droplet.outputs.droplet_id }}")"
            echo "destroy droplet -> HTTP $CODE"
            [ "$CODE" = "204" ] || echo "::warning::droplet ${{ steps.droplet.outputs.droplet_id }} may still exist"
          fi
          if [ -n "${{ steps.sshkey.outputs.key_id }}" ]; then
            curl -s -o /dev/null -w 'delete ssh key -> HTTP %{http_code}\n' -X DELETE \
              -H "Authorization: Bearer $DO_TOKEN" "$DO_API/account/keys/${{ steps.sshkey.outputs.key_id }}"
          fi

      - name: Confirm nothing was left behind
        if: always()
        run: |
          set -uo pipefail
          LEFT="$(curl -s -H "Authorization: Bearer $DO_TOKEN" "$DO_API/droplets?per_page=200" \
            | jq -r '[.droplets[]? | select(.name|startswith("empyralis-e2e-cloudinit-")) | "\(.id) \(.name)"] | .[]' 2>/dev/null || true)"
          [ -n "$LEFT" ] && { echo "::warning::leftover droplets:"; echo "$LEFT"; } || echo "no leftover droplets"
