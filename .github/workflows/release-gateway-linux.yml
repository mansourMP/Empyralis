name: Release Gateway (Linux)

# Builds the prebuilt, self-contained Agent Computer gateway artifact that
# scripts/install-agent-computer.sh downloads on every provisioned droplet
# (install-agent-computer.sh:26-27) and that gateway_self_update_service.py
# points at (server_modules/gateway_self_update_service.py:82).
#
# WHAT THIS JOB DOES: produces `empyralis-gateway-linux-<arch>.tar.gz` plus a
# `.sha256` sidecar, hands them back as a workflow artifact, AND publishes them
# to Cloudflare R2 (bucket `empyralis-agent-computer-releases`) at
# agent-computer/<version>/ — see MAN-122. A Cloudflare Worker route on
# empyralis.ai/releases/* serves that bucket back out over plain HTTPS, which
# is what install-agent-computer.sh and gateway_self_update_service.py expect.
#
# Credentials: R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY repo secrets, scoped to
# Object Read & Write on this one bucket only (not account-admin).
#
# Archive layout is fixed by two consumers and must not drift:
#   - scripts/install-agent-computer.sh:368-380 (`tar -xzf` into
#     <stage>/empyralis-gateway, then asserts dist/index.js exists)
#   - empyralis-gateway/src/update/gateway-artifact-installer.ts:202-233
#     (identical extraction + assertion for self-update)
# => the archive ROOT holds dist/, node_modules/, package.json,
# openclaw-bridge-plugin/. No wrapper directory. Both consumers create the
# `empyralis-gateway/` level themselves.
#
# openclaw-bridge-plugin/ (added 2026-08-14, MAN-channel-transport-missing):
# openclaw-provisioning-runtime.ts's defaultBridgePluginPath() resolves the
# OpenClaw channel-transport plugin at runtime as
# <package root>/openclaw-bridge-plugin, i.e. a SIBLING of dist/ — a path
# this workflow never staged or packed. Every Agent Computer ever built from
# this pipeline therefore came up with a working gateway and a channel
# transport that OpenClaw refused to load ("plugin path not found"),
# degrading silently to "the Agent Computer works, channels do not". Shipped
# as raw .ts SOURCE, not compiled: OpenClaw's own plugin loader
# (plugin-module-loader-cache.js) transpiles a non-.js/.mjs/.cjs plugin
# entry on the fly via its bundled `jiti`, and the plugin's own
# openclaw.plugin.json declares its entry as "./index.ts" — verified locally
# against the pinned openclaw@2026.6.10 build (`plugins doctor` / `plugins
# list --json` report status "loaded" reading directly off this exact
# directory shape, no build step). See the "Verify archive matches..." step
# below for what closes the gap that let this ship unnoticed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version label for the artifact. The installer defaults to "latest"
          (install-agent-computer.sh:18), so a build intended for new droplets
          must ultimately be reachable at .../releases/agent-computer/latest/.
        required: true
        default: latest
  # AUTOMATIC PUBLISH (2026-08-13, gateway artifact staleness incident): this
  # job used to be workflow_dispatch-only, exactly the "a human must remember
  # to run this" defect CLAUDE.md already documents for the Rust kernel
  # binary. It went unrun for the entire OpenClaw channel-transport build
  # (31 commits to empyralis-gateway/ between the last manual run on
  # 2026-07-29 and 2026-08-13) — every provisioned Agent Computer downloaded
  # a gateway with no `dist/openclaw/provisioning/` in it, so
  # install_channel_transport failed with "this gateway build has no channel
  # transport installer" on every real box, silently. A merge now publishes
  # itself; nobody has to remember. `latest` is still the only version this
  # writes to (matching the installer's own default target and every
  # existing consumer), so a manual workflow_dispatch run remains available
  # for a deliberate pinned-version release and behaves exactly as before.
  push:
    branches: [main]
    paths:
      - "empyralis-gateway/**"
      - ".github/workflows/release-gateway-linux.yml"

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: gateway-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gateway:
    name: Gateway ${{ matrix.arch }} tarball
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch supplies `inputs.version`; a push event has no
      # inputs at all (the `inputs` context reads empty, not the declared
      # default), so this is the one place that decides what every step
      # below publishes to. A push always means "latest" — the same target
      # install-agent-computer.sh already defaults to and every droplet that
      # doesn't pin EMPYRALIS_AGENT_COMPUTER_VERSION already requests.
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The only arch any droplet actually requests today.
          - arch: x64
            npm_cpu: x64
          # Cross-packaged, not cross-compiled: dist/ is plain JavaScript and
          # the only arch-specific dependency (sharp, pulled in as a Baileys
          # peer) ships prebuilt per-arch packages that npm selects from the
          # --cpu override. Costs about a minute; nothing consumes it yet.
          - arch: arm64
            npm_cpu: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The droplet installs Node 20 itself (install-agent-computer.sh:174-192)
      # and run-gateway execs the system `node`, so the tarball ships NO
      # runtime — only compiled JS plus production node_modules. Building on
      # Node 20 keeps the compiled output and the installed native prebuilds
      # matched to the runtime that will actually execute them.
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
        working-directory: empyralis-gateway

      - name: Compile TypeScript
        run: npm run build
        working-directory: empyralis-gateway

      - name: Stage compiled output
        run: mv empyralis-gateway/dist "$RUNNER_TEMP/dist"

      # Reinstall production-only, with the target platform pinned so npm
      # resolves the Linux/<arch> optional binaries (@img/sharp-linux-<arch>,
      # bufferutil, utf-8-validate) rather than the runner's own.
      - name: Install production dependencies for linux-${{ matrix.arch }}
        run: npm ci --omit=dev --os=linux --cpu=${{ matrix.npm_cpu }} --libc=glibc --no-audit --no-fund
        working-directory: empyralis-gateway

      - name: Assemble artifact tree
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/gateway-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          mv "$RUNNER_TEMP/dist" "$STAGE/dist"
          cp -R empyralis-gateway/node_modules "$STAGE/node_modules"
          cp empyralis-gateway/package.json "$STAGE/package.json"

          # The OpenClaw channel-transport plugin. Ship exactly what OpenClaw
          # loads at runtime (index.ts, openclaw.plugin.json, src/*.ts,
          # types/*.d.ts, package.json) and nothing dev-only: unit tests, the
          # local verification harness (which embeds its own throwaway
          # openclaw.plugin.json and would otherwise ship a second, unloaded
          # plugin manifest inside this one's directory), tsconfig.json and
          # package-lock.json are never opened by OpenClaw's loader at load
          # time. See the header comment above for why raw .ts is correct
          # here rather than a build step.
          mkdir -p "$STAGE/openclaw-bridge-plugin"
          rsync -a \
            --exclude 'src/__tests__' \
            --exclude 'verify' \
            --exclude 'node_modules' \
            --exclude 'package-lock.json' \
            --exclude 'tsconfig.json' \
            empyralis-gateway/openclaw-bridge-plugin/ "$STAGE/openclaw-bridge-plugin/"

          test -f "$STAGE/dist/index.js"
          test -f "$STAGE/openclaw-bridge-plugin/index.ts"
          test -f "$STAGE/openclaw-bridge-plugin/openclaw.plugin.json"

      - name: Create tarball and checksum
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/gateway-stage"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          TARBALL="empyralis-gateway-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$OUT/$TARBALL" -C "$STAGE" dist node_modules package.json openclaw-bridge-plugin
          ( cd "$OUT" && sha256sum "$TARBALL" > "$TARBALL.sha256" )
          ls -l "$OUT"
          echo "GATEWAY_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # Re-runs the exact extraction both consumers perform, so a layout
      # regression fails here rather than silently on a customer droplet.
      #
      # COMPLETENESS GATE (follow-up to the 2026-08-13 gateway-artifact-
      # staleness incident documented in the `push:` trigger comment above).
      # That incident shipped for 15 days because this step only ever
      # checked dist/index.js — the bundle's entry point loads fine even
      # when a whole feature directory (dist/openclaw/provisioning/, the
      # OpenClaw channel-transport installer) is missing entirely, so a
      # stale "latest" tarball built before that directory existed passed
      # this gate on every run.
      #
      # The required-paths set below is DERIVED from
      # scripts/install-agent-computer.sh itself (a grep for the literal
      # `gateway/dist/**/*.js` paths that script opens with `-f` —
      # install_channel_transport at install-agent-computer.sh:392-430
      # needs openclaw-install-plan-cli.js, its Node-version read at line
      # 344 needs openclaw-version.js), never hand-copied into this
      # workflow. CLAUDE.md's standing rule: the expected set and the
      # actual set must come from different sources, or a check can only
      # ever confirm itself. Here "expected" comes from a grep of the
      # installer's own source and "actual" comes from extracting the
      # tarball this job just built — two independent reads, so a file the
      # installer starts requiring tomorrow is covered automatically,
      # without anyone editing this workflow. A plain hand-written literal
      # list here would be exactly the "channel list copied into a third
      # place" shape CLAUDE.md already flags elsewhere as a defect once it
      # can drift from its source in the same language.
      #
      # The canary checks below exist because a DERIVED check can go blind
      # in its own way: if scripts/install-agent-computer.sh is ever
      # rewritten in a style this grep doesn't match, the derived list
      # silently becomes empty (or drops the one file this gate exists
      # for) and the step would otherwise pass vacuously. Fail loudly on
      # that distinction — "the grep broke" vs "the archive is missing a
      # file" — rather than let the first one masquerade as the second.
      - name: Verify archive matches what the installer expects
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY/empyralis-gateway"
          tar -xzf "$RUNNER_TEMP/out/$GATEWAY_TARBALL" -C "$VERIFY/empyralis-gateway"
          test -f "$VERIFY/empyralis-gateway/dist/index.js" \
            || { echo "archive is missing dist/index.js at the installer-expected path" >&2; exit 1; }
          test -f "$VERIFY/empyralis-gateway/package.json"
          test -d "$VERIFY/empyralis-gateway/node_modules"

          mapfile -t REQUIRED_PATHS < <(
            grep -oE 'gateway/dist/[A-Za-z0-9/_.-]+\.(js|json)' scripts/install-agent-computer.sh \
              | sed 's#^gateway/##' \
              | sort -u
          )

          if [[ "${#REQUIRED_PATHS[@]}" -eq 0 ]]; then
            echo "derived zero required paths from scripts/install-agent-computer.sh — the extraction pattern in this workflow no longer matches that script; fix the grep in release-gateway-linux.yml before trusting this gate" >&2
            exit 1
          fi
          if ! printf '%s\n' "${REQUIRED_PATHS[@]}" | grep -qx 'dist/openclaw/provisioning/openclaw-install-plan-cli.js'; then
            echo "derived required-paths list no longer includes dist/openclaw/provisioning/openclaw-install-plan-cli.js — the grep pattern in release-gateway-linux.yml drifted from install-agent-computer.sh's own style; fix it before trusting this gate" >&2
            exit 1
          fi

          missing=0
          for rel in "${REQUIRED_PATHS[@]}"; do
            if [[ ! -f "$VERIFY/empyralis-gateway/$rel" ]]; then
              echo "MISSING: $rel" >&2
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo >&2
            echo "archive is missing one or more files scripts/install-agent-computer.sh requires by path — install_channel_transport (install-agent-computer.sh:392-430) needs dist/openclaw/provisioning/openclaw-install-plan-cli.js, and its Node-version read (install-agent-computer.sh:344) needs dist/openclaw/provisioning/openclaw-version.js. This is the exact shape of the 2026-08-13 gateway-artifact-staleness incident (dist/index.js present, a whole feature directory absent) — refusing to publish a tarball an Agent Computer cannot fully install channels from." >&2
            exit 1
          fi

          # SECOND completeness check, deliberately sourced from a DIFFERENT
          # file than the one above. The grep against install-agent-computer.sh
          # can only ever see paths that script names literally — it is blind
          # to a path the *gateway's own runtime* resolves relative to its
          # package root in TypeScript. That blind spot is exactly how the
          # openclaw-bridge-plugin/ directory (the OpenClaw channel-transport
          # plugin, loaded at runtime by defaultBridgePluginPath() as
          # "<package root>/openclaw-bridge-plugin", a SIBLING of dist/) went
          # unpacked for every release before 2026-08-14: install-agent-
          # computer.sh never names that path, so it could never appear in
          # REQUIRED_PATHS above no matter how that grep is written.
          #
          # Expected value comes from openclaw-provisioning-runtime.ts's own
          # defaultBridgePluginPath() source (not from this workflow, not from
          # the packing step above); actual comes from extracting the tarball
          # this job just built — two independent reads, same discipline as
          # the block above.
          RUNTIME_SRC="empyralis-gateway/src/openclaw/provisioning/openclaw-provisioning-runtime.ts"
          BRIDGE_PLUGIN_DIR_NAME="$(grep -oE 'path\.resolve\(path\.dirname\(entryPath\), "\.\.", "[A-Za-z0-9_-]+"\)' "$RUNTIME_SRC" \
            | grep -oE '"[A-Za-z0-9_-]+"\)$' | tr -d '")')"

          if [[ -z "${BRIDGE_PLUGIN_DIR_NAME}" ]]; then
            echo "could not derive the bridge plugin directory name from ${RUNTIME_SRC}'s defaultBridgePluginPath() — that function's shape changed and this grep no longer matches it; fix the grep in release-gateway-linux.yml before trusting this gate" >&2
            exit 1
          fi
          if [[ "${BRIDGE_PLUGIN_DIR_NAME}" != "openclaw-bridge-plugin" ]]; then
            echo "derived bridge plugin directory name is '${BRIDGE_PLUGIN_DIR_NAME}', expected 'openclaw-bridge-plugin' — either the runtime source changed the directory name (update the packing/tar steps above to match) or this grep drifted; fix before trusting this gate" >&2
            exit 1
          fi

          BRIDGE_PLUGIN_DIR="$VERIFY/empyralis-gateway/${BRIDGE_PLUGIN_DIR_NAME}"
          if [[ ! -d "${BRIDGE_PLUGIN_DIR}" ]]; then
            echo "archive is missing ${BRIDGE_PLUGIN_DIR_NAME}/ — defaultBridgePluginPath() resolves the OpenClaw channel-transport plugin here, relative to the package root, and every provisioned Agent Computer would come up with a working gateway and NO channel transport (OpenClaw refuses with 'plugin path not found', logged, never failing the install). This is the exact bug fixed 2026-08-14." >&2
            exit 1
          fi
          if [[ -z "$(find "${BRIDGE_PLUGIN_DIR}" -type f -print -quit)" ]]; then
            echo "${BRIDGE_PLUGIN_DIR_NAME}/ exists in the archive but is empty" >&2
            exit 1
          fi

          # The directory existing and being non-empty is not enough — assert
          # the specific files OpenClaw's plugin loader actually opens.
          # openclaw.plugin.json carries this plugin's id/name/description
          # (confirmed against a real `openclaw plugins list --json` read,
          # which reports "name": "Empyralis Bridge" straight off this file)
          # but NOT the entry path — that is declared in package.json's own
          # "openclaw.extensions" array (also confirmed live: `plugins list`
          # reports this plugin's loaded "source" as index.ts, the exact
          # value package.json declares, not anything in openclaw.plugin.json,
          # which has no "extensions" key at all). Read each from where
          # OpenClaw actually reads it — a THIRD independent source from
          # this workflow's packing list and the runtime source grepped
          # above.
          PLUGIN_MANIFEST="${BRIDGE_PLUGIN_DIR}/openclaw.plugin.json"
          test -f "${PLUGIN_MANIFEST}" \
            || { echo "MISSING: ${BRIDGE_PLUGIN_DIR_NAME}/openclaw.plugin.json (OpenClaw's plugin loader reads this for id/name/description)" >&2; exit 1; }

          PLUGIN_PACKAGE_JSON="${BRIDGE_PLUGIN_DIR}/package.json"
          test -f "${PLUGIN_PACKAGE_JSON}" \
            || { echo "MISSING: ${BRIDGE_PLUGIN_DIR_NAME}/package.json (declares this plugin's entry path under .openclaw.extensions)" >&2; exit 1; }

          PLUGIN_ENTRY_REL="$(jq -r '.openclaw.extensions[0] // empty' "${PLUGIN_PACKAGE_JSON}")"
          if [[ -z "${PLUGIN_ENTRY_REL}" ]]; then
            echo "${BRIDGE_PLUGIN_DIR_NAME}/package.json has no .openclaw.extensions[0] — cannot determine what OpenClaw would try to load; fix the plugin's package.json or this check" >&2
            exit 1
          fi
          PLUGIN_ENTRY_REL="${PLUGIN_ENTRY_REL#./}"
          test -f "${BRIDGE_PLUGIN_DIR}/${PLUGIN_ENTRY_REL}" \
            || { echo "MISSING: ${BRIDGE_PLUGIN_DIR_NAME}/${PLUGIN_ENTRY_REL} — declared as this plugin's own entry point in package.json's .openclaw.extensions, but absent from the packed archive" >&2; exit 1; }

      # Best-effort: GitHub's attestation storage isn't available for
      # user-owned private repos on the current plan ("Feature not available
      # for user-owned private repositories" — confirmed 2026-07-29). That's
      # a plan limitation, not a build problem, and it must never block the
      # publish steps below — the artifact itself already passed the
      # layout-verification step above regardless of whether this runs.
      - name: Attest gateway artifact provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/out/${{ env.GATEWAY_TARBALL }}

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: empyralis-gateway-linux-${{ matrix.arch }}-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30

      # Publishes to the SAME place install-agent-computer.sh downloads from
      # by default (empyralis.ai/releases/agent-computer/<version>/) via the
      # R2 bucket a Cloudflare Worker route serves back out. The AWS CLI
      # talks to R2 through its S3-compatible endpoint; nothing here is a
      # real AWS credential.
      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://76e485cbfb611ff8caa5c1d2afa71890.r2.cloudflarestorage.com"
          BUCKET="empyralis-agent-computer-releases"
          DEST="s3://${BUCKET}/agent-computer/${RELEASE_VERSION}/"
          aws s3 cp "$RUNNER_TEMP/out/$GATEWAY_TARBALL" "$DEST" --endpoint-url "$ENDPOINT"
          aws s3 cp "$RUNNER_TEMP/out/$GATEWAY_TARBALL.sha256" "$DEST" --endpoint-url "$ENDPOINT"

      # Publish the installer script itself, from the SAME commit that built
      # the artifact above.
      #
      # WHY THIS EXISTS (MAN-121/MAN-122, 2026-07-29): the Cloudflare Worker
      # serving empyralis.ai/install/agent-computer.sh used to carry its own
      # EMBEDDED copy of this script, updated by hand. It silently drifted ~50
      # days behind the repo. Droplets were therefore running an installer that
      # (a) still demanded an `empyralis-supervisor-linux-x64.tar.gz` that no
      # longer exists in this codebase and was never published — so every
      # install died on a 404 — and (b) predated the failure-beacon code, so it
      # could not report *why* it died. Both the failure and the silence came
      # from the same drift. The Worker now fetches this object instead, so
      # what droplets run is whatever this workflow last published, and the
      # repo can no longer disagree with production without anyone noticing.
      - name: Publish installer script to Cloudflare R2
        if: matrix.arch == 'x64'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://76e485cbfb611ff8caa5c1d2afa71890.r2.cloudflarestorage.com"
          BUCKET="empyralis-agent-computer-releases"
          DEST="s3://${BUCKET}/agent-computer/${RELEASE_VERSION}/install-agent-computer.sh"
          # Fail loudly rather than publishing an installer that cannot report
          # its own failures — that combination is exactly what hid the bug.
          grep -q 'provisioning-events' scripts/install-agent-computer.sh \
            || { echo "installer is missing its failure-beacon path; refusing to publish" >&2; exit 1; }
          aws s3 cp scripts/install-agent-computer.sh "$DEST" \
            --endpoint-url "$ENDPOINT" --content-type "text/x-shellscript"
