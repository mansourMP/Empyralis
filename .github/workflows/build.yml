name: Release Desktop

# macOS and Linux only — Windows is explicitly out of scope for this app
# (CLAUDE.md's "Windows is out" entry: "VPS is Linux, fuck Windows we are
# not going toward that"). Do not add a windows job back.
#
# This app is a native host for the real, hosted Empyralis webview plus the
# `empyralis-gateway` child process it spawns and supervises — it no longer
# bundles a Python backend or a locally-built Next.js frontend (see
# src-tauri/src/lib.rs's own top-of-file doc comment for the full shape).
# So this workflow's job is: build the gateway, fetch the exact pinned
# portable Node runtime it will run under (built native addons included),
# bundle both as Tauri RESOURCES (never a Tauri "sidecar" — the gateway is
# `node dist/index.js`, not a single self-contained executable), then sign
# and publish the desktop shell around them.

on:
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS signed release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js (toolchain — compiles the gateway; not what ships)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gateway dependencies and build
        working-directory: empyralis-gateway
        run: |
          npm ci
          npm run build

      - name: Resolve pinned portable Node version
        id: node_pin
        run: |
          VERSION="$(node -e "process.stdout.write(require('./empyralis-gateway/dist/update/desktop-node-version.js').DESKTOP_GATEWAY_NODE_VERSION)")"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve DESKTOP_GATEWAY_NODE_VERSION from the built gateway artifact." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch portable Node runtime (arm64 + x64, both ship — universal-capable bundle)
        env:
          NODE_PIN: ${{ steps.node_pin.outputs.version }}
        run: |
          set -euo pipefail
          for ARCH in arm64 x64; do
            DEST="src-tauri/resources/node-runtime-$ARCH"
            TARBALL="node-v${NODE_PIN}-darwin-${ARCH}.tar.gz"
            URL="https://nodejs.org/dist/v${NODE_PIN}/${TARBALL}"
            echo "Fetching $URL"
            curl -fsSL -o "/tmp/$TARBALL" "$URL"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            tar -xzf "/tmp/$TARBALL" -C "$DEST" --strip-components=1
            test -x "$DEST/bin/node"
          done
          # This runner is one arch; use its own match to compile the
          # gateway's native addons (bufferutil, utf-8-validate, sharp)
          # against the EXACT bundled Node, then bundle the matching arch's
          # runtime as the one Tauri packages for this build. A universal
          # (arm64+x64) single bundle is future work — today's macOS
          # release job runs once per architecture via the matrix below if
          # ever split; for now this targets the runner's native arch.
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            arm64) echo "resolved_arch=arm64" >> "$GITHUB_ENV" ;;
            x86_64) echo "resolved_arch=x64" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac

      - name: Rebuild gateway native addons under the pinned portable Node
        working-directory: empyralis-gateway
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/src-tauri/resources/node-runtime-$resolved_arch/bin:$PATH"
          node --version
          rm -rf node_modules
          npm ci
          npm run build

      - name: Place bundled resources
        run: |
          set -euo pipefail
          rm -rf src-tauri/resources/node-runtime
          mv "src-tauri/resources/node-runtime-$resolved_arch" src-tauri/resources/node-runtime
          rm -rf src-tauri/resources/node-runtime-arm64 src-tauri/resources/node-runtime-x64
          test -x src-tauri/resources/node-runtime/bin/node
          test -f empyralis-gateway/dist/index.js

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/empyralis-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/empyralis-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare notarization API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Generate release-only Tauri config
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 scripts/write_tauri_release_config.py --output src-tauri/tauri.release.conf.json

      - name: Build, sign, notarize, and publish macOS release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Empyralis ${{ github.ref_name }}
          releaseBody: Automated signed desktop release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --config tauri.release.conf.json

      - name: Attest macOS release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*

  linux:
    name: Linux signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Setup Node.js (toolchain — compiles the gateway; not what ships)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gateway dependencies and build
        working-directory: empyralis-gateway
        run: |
          npm ci
          npm run build

      - name: Resolve pinned portable Node version
        id: node_pin
        run: |
          VERSION="$(node -e "process.stdout.write(require('./empyralis-gateway/dist/update/desktop-node-version.js').DESKTOP_GATEWAY_NODE_VERSION)")"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve DESKTOP_GATEWAY_NODE_VERSION from the built gateway artifact." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch portable Node runtime for this runner's architecture
        env:
          NODE_PIN: ${{ steps.node_pin.outputs.version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64) ARCH=arm64 ;;
            *) echo "Unsupported host arch: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "resolved_arch=$ARCH" >> "$GITHUB_ENV"
          TARBALL="node-v${NODE_PIN}-linux-${ARCH}.tar.xz"
          URL="https://nodejs.org/dist/v${NODE_PIN}/${TARBALL}"
          echo "Fetching $URL"
          curl -fsSL -o "/tmp/$TARBALL" "$URL"
          rm -rf src-tauri/resources/node-runtime
          mkdir -p src-tauri/resources/node-runtime
          tar -xJf "/tmp/$TARBALL" -C src-tauri/resources/node-runtime --strip-components=1
          test -x src-tauri/resources/node-runtime/bin/node

      - name: Rebuild gateway native addons under the pinned portable Node
        working-directory: empyralis-gateway
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/src-tauri/resources/node-runtime/bin:$PATH"
          node --version
          rm -rf node_modules
          npm ci
          npm run build

      - name: Confirm bundled resources are in place
        run: |
          test -x src-tauri/resources/node-runtime/bin/node
          test -f empyralis-gateway/dist/index.js

      - name: Generate release-only Tauri config
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: python3 scripts/write_tauri_release_config.py --output src-tauri/tauri.release.conf.json

      - name: Build, sign, and publish Linux release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Empyralis ${{ github.ref_name }}
          releaseBody: Automated signed desktop release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --config tauri.release.conf.json

      - name: Attest Linux release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*
