# Empyralis — Nginx reverse proxy for empyralis.ai, TLS via Certbot.
#
# 2026-07-16 (MCP OAuth connector build): added location blocks for /mcp,
# /mcp/consent, and the OAuth authorization-server surface (/authorize,
# /token, /register, /revoke, the two /.well-known/* metadata routes).
# Before this, NONE of those paths had a location block, so they fell
# through to the `location /` catch-all and were served (404'd) by Next.js
# instead of the FastAPI backend — meaning /mcp itself was not actually
# reachable from the public internet even though server.py has mounted it
# since before this file existed. mount_empyralist_mcp() in mcp_server.py
# only re-registers the OAuth routes at the domain root (instead of nested
# under /mcp) when EMPYRALIS_MCP_OAUTH_ENABLED is set on the backend; with
# it unset the backend simply won't have handlers for /authorize etc. and
# these blocks proxy through to a 404 from FastAPI, which is fine — nginx
# doesn't need to know the flag's state, only where the backend process is.
# NOT applied to the live server by editing this file — see the Install
# step below; this still requires the normal deploy-runbook nginx step.
#
# Reconciled against the actual running VPS 2026-07-10 (Truth Map deploy-prep
# pass). What was live before this file existed:
#   - A duplicate site file (`empyralis.pre-mcp`) sitting in sites-enabled/
#     alongside this one, causing "conflicting server name" warnings on every
#     nginx reload. Only one site file should exist for this domain — this one.
#   - Location blocks for /session, /chat, /chat/history, /memory, /tasks,
#     /apps, /oauth/ proxying to 127.0.0.1:8000 — a "v2" backend that was
#     never actually deployed (its systemd units exist but are inactive; no
#     process has ever listened on 8000 on this box). Confirmed via source
#     grep that no current frontend code calls any of these bare paths
#     (Next.js's own /api/* route handlers proxy server-side to
#     EMPYRALIS_API_URL, bypassing nginx for those calls entirely) — removed
#     rather than pointed at a real backend, since nothing needs them.
#   - /health was ALSO pointed at the dead port 8000. The real backend
#     (server_modules/routes_health.py) serves a real /health on 8001 —
#     fixed below.
#   - X-Forwarded-Proto was set to $http_x_forwarded_proto (the CLIENT's own
#     header — browsers never send one, so this forwarded empty) instead of
#     $scheme (nginx's own, correct, actual scheme). server_modules/auth.py's
#     _cookie_secure() falls back to reading this header when the resolved
#     deploy environment isn't recognized as production — the combination of
#     that env-resolution gap (see docs/DEPLOY-RUNBOOK.md,
#     EMPYRALIS_DEPLOY_ENV) and this header bug meant auth cookies were
#     shipping without Secure in production. Fixed below; also fixed at the
#     env layer for defense-in-depth.
#   - The main server block also self-duplicated 165.227.25.201 into its own
#     server_name alongside the dedicated bare-IP redirect block below —
#     pre-existing (not introduced by the .pre-mcp cleanup above), caused its
#     own "conflicting server name" warning once the louder duplicate-file
#     warnings were gone, and meant bare-IP HTTPS requests silently served
#     the main block's content instead of 302'ing to the canonical domain.
#     Removed from the main block; the redirect block below is now the sole
#     owner of that name.
#
# Install: copy to /etc/nginx/sites-available/empyralis, symlink into
# sites-enabled/, remove any other file for this domain, `nginx -t`, reload.
# See docs/DEPLOY-RUNBOOK.md.

server {
    server_name empyralis.ai;

    # ── Security headers ────────────────────────────────────────────────────
    # Added 2026-08-12. Before this the live site served NONE of these —
    # verified on the wire, not from source: `curl -sI https://empyralis.ai/`
    # returned only `server: cloudflare` and `x-powered-by: Next.js`.
    #
    # `always` on every one of them: without it nginx omits the header on
    # error responses (4xx/5xx), and an error page is served from the same
    # origin and is just as frameable and just as sniffable as a 200.
    #
    # NOTE FOR WHOEVER EDITS THIS FILE NEXT: `add_header` does not inherit
    # into a block that declares its own. If you ever add an `add_header` to
    # one of the `location` blocks below, EVERY header here silently stops
    # applying to that location — the app keeps working and the protection
    # is just gone. There is deliberately no `add_header` in any location
    # block today; keep it that way, or repeat the whole set.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Not `preload`: that submits the domain to a browser-baked list that is
    # slow and painful to get off, which is the founder's call to make, not
    # a side effect of adding headers.

    # The app is never legitimately framed. X-Frame-Options for older
    # browsers, frame-ancestors for the ones that honour CSP — the CSP form
    # supersedes it, so both are set on purpose.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # ^ deliberately ONLY frame-ancestors. A real script-src/style-src policy
    # for a Next.js app needs per-request nonces threaded through the
    # framework's own inline bootstrap; shipping a lazy one with
    # 'unsafe-inline' 'unsafe-eval' would look like a CSP and stop nothing.
    # Tracked as its own job rather than faked here.

    # Matters more here than it looks: attachments are handed back by
    # FastAPI's FileResponse on this same origin (see
    # upload_content_policy.py, which refuses SVG for exactly this reason).
    # nosniff is the other half of that defence — it stops a browser
    # deciding for itself that an uploaded .txt is really HTML.
    add_header X-Content-Type-Options "nosniff" always;

    # Documents render external links (target="_blank") as of 2026-08-12, so
    # this stopped being theoretical: without it the full URL — workspace id,
    # project id, document id — travels in the Referer header to whatever
    # site the link points at, and an agent can write that link. Third-party
    # requests now carry the origin only.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Features the app does not use anywhere (grepped: no getUserMedia, no
    # navigator.geolocation, no payment request). Denying them costs nothing
    # and removes them as a pivot from any script that does get injected.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Increase body size for file uploads
    client_max_body_size 50m;

    # SSE streaming requires unbuffered responses
    proxy_buffering off;
    proxy_cache off;

    # Real backend (uvicorn server:app, port 8001 — see deploy/empyralis-backend.service)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Gateway (REST + WebSocket) — server.py mounts gateway_router at prefix
    # "/api", so its real paths are /api/gateway/*, not /api/v1/*. Plain
    # /api/gateway/* REST calls were accidentally "working" via Next.js's own
    # server-side /api/* proxy-through to EMPYRALIS_API_URL (see the note
    # above on the v2-backend cleanup) — but a raw WebSocket upgrade for
    # /api/gateway/ws can't be relayed through a fetch()-based route handler,
    # so every Gateway's live connection was silently failing. Needs its own
    # location, not just falling through to location / below.
    location /api/gateway/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCP protocol endpoint (server_modules/mcp_server.py, mounted in
    # server.py) — streamable-HTTP is long-lived/SSE-like, same unbuffered +
    # long-timeout treatment as /api/gateway/ above. Serves both the legacy
    # per-workspace bearer-key clients (Claude Code CLI) and, once
    # EMPYRALIS_MCP_OAUTH_ENABLED is on, OAuth-authenticated clients.
    # Exact /mcp: proxy straight to the mounted sub-app's root (trailing
    # slash) so clients that don't follow 307s never see the Starlette
    # mount redirect. The prefix block below covers /mcp/<anything> (the
    # protocol path itself plus any SDK sub-routes). Was `location = /mcp`
    # ONLY — so /mcp/<anything> fell through to the Next.js catch-all and
    # the endpoint was unreachable end-to-end (platform-MCP audit).
    location = /mcp {
        proxy_pass http://127.0.0.1:8001/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location /mcp/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP OAuth consent screen (server_modules/mcp_oauth_provider.py) — a
    # plain FastAPI HTML page, not part of the long-lived /mcp protocol path.
    location = /mcp/consent {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP OAuth authorization server (RFC 7591/8414/9728 — implemented by the
    # mcp SDK + server_modules/mcp_oauth_provider.py). mount_empyralist_mcp()
    # registers these at the domain root — not nested under /mcp — because
    # the configured issuer_url has no path component and RFC 8414/9728
    # client discovery looks for them here. Proxying them through even when
    # EMPYRALIS_MCP_OAUTH_ENABLED is off is harmless: the backend simply has
    # no route for them yet and answers 404 itself.
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource/mcp)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend (everything else) — server_modules/empyralis-frontend.service, port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/empyralis.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/empyralis.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Bare-IP requests -> the real domain
server {
    listen 80;
    listen 443 ssl;
    server_name 165.227.25.201;
    ssl_certificate /etc/letsencrypt/live/empyralis.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/empyralis.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 302 https://empyralis.ai$request_uri;
}

# HTTP -> HTTPS redirect for the primary domain
server {
    if ($host = empyralis.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name empyralis.ai;
    return 404; # managed by Certbot
}
