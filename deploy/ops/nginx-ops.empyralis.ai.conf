# Empyralis operator console — Nginx reverse proxy for ops.empyralis.ai,
# TLS via Certbot. Modeled on deploy/nginx-empyralis.conf's shape (same
# security headers, same Certbot-managed TLS block, same bare-IP/HTTP
# redirect pattern) -- see that file's own header for the reasoning behind
# each header. This block is deliberately simpler: the operator console app
# proxies its OWN backend calls server-side (ops/lib/server/operator-
# proxy.ts, talking to 127.0.0.1:8001 exactly like frontend/lib/server/
# control-plane-proxy.ts does), so nginx only ever needs to reach the ops
# Next.js process — no /api/v1/, /api/gateway/, /mcp, or OAuth location
# blocks here; this app doesn't mount any of those.
#
# WRITTEN, NOT APPLIED. Per the task this shipped under: the agent that
# wrote this does not touch the production box, DNS, or nginx directly --
# install it the same deliberate way deploy/nginx-empyralis.conf's own
# header describes.
#
# Prerequisites on the box BEFORE this file does anything useful:
#   1. DNS: ops.empyralis.ai -> the same droplet empyralis.ai already
#      resolves to (an A/AAAA record, alongside the existing gw.empyralis.ai
#      precedent).
#   2. The ops app deployed to its own directory (e.g. /opt/empyralis-app/ops,
#      a sibling of /opt/empyralis-app/frontend) and started via
#      deploy/ops/empyralis-ops.service on its own port (3100 below --
#      change PORT in that unit and the proxy_pass below together if a
#      different port is chosen; 3100 was picked only because 3000 is
#      already the customer frontend's).
#   3. `FRONTEND_ORIGINS` (backend env) and `EMPYRALIS_AUTH_COOKIE_DOMAIN`
#      (backend env) BOTH need ops.empyralis.ai / the shared parent domain
#      added -- see empyralis-ops.service's own header comment for exactly
#      what "reuse the platform's existing session" requires from the
#      backend's side. This nginx file alone does not make auth work.
#
# Install: copy to /etc/nginx/sites-available/ops.empyralis.ai, symlink into
# sites-enabled/, `certbot --nginx -d ops.empyralis.ai` (issues the cert AND
# rewrites this file's TLS block the same way it manages empyralis.ai's --
# the block below is a placeholder in the same shape certbot expects),
# `nginx -t`, reload.

server {
    server_name ops.empyralis.ai;

    # ── Security headers -- identical set to deploy/nginx-empyralis.conf.
    # `always` on every one: without it nginx omits the header on error
    # responses, and an error page on an operator tool showing every
    # workspace's data is just as sensitive as a 200.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # This console has no public/unauthenticated surface and is never meant
    # to be indexed -- belt-and-braces alongside app/layout.tsx's own
    # `robots: { index: false, follow: false }` metadata.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No file uploads on this app -- default client_max_body_size is fine.

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ops.empyralis.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ops.empyralis.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS redirect, same shape as deploy/nginx-empyralis.conf's own.
server {
    if ($host = ops.empyralis.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ops.empyralis.ai;
    return 404; # managed by Certbot
}
