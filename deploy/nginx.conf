# Empyralis v2 — Nginx reverse proxy
# Place at /etc/nginx/sites-available/empyralis, symlink to sites-enabled.
# Run: nginx -t && systemctl reload nginx

# HTTP — add TLS with: certbot --nginx -d yourdomain.com
server {
    listen 80;
    server_name _;

    # SSE streaming requires unbuffered responses
    proxy_buffering off;
    proxy_cache off;

    # API proxy — strips /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # SSE: long-running connections for streaming chat
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static frontend (Next.js build output)
    location / {
        root /var/www/empyralis;
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
