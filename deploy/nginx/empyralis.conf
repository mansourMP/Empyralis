# Empyralis v2 — Nginx reverse proxy (with Let's Encrypt TLS via certbot)
# Backend API on port 8000, Next.js frontend on port 3000.
# Deployed at /etc/nginx/sites-available/empyralis, symlinked to sites-enabled.
# TLS managed by certbot — auto-renews via systemd timer.

server {
    server_name empyralis.ai 165.227.25.201;

    # Increase body size for file uploads
    client_max_body_size 50m;

    # SSE streaming requires unbuffered responses
    proxy_buffering off;
    proxy_cache off;

    # ── v2 Backend API routes (exact match — avoid colliding with Next.js pages) ──

    location = /session {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Long timeout for SSE streaming chat
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /chat/history {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /memory {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /tasks {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # /apps and /apps/{provider} — prefix match covers GET + DELETE sub-paths
    location /apps {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # OAuth routes — prefix-based to cover /oauth/start, /oauth/callback
    location /oauth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ── Next.js frontend (everything else) ──

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/empyralis.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/empyralis.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Redirect IP-only requests to domain
server {
    listen 80;
    listen 443 ssl;
    server_name 165.227.25.201;
    ssl_certificate /etc/letsencrypt/live/empyralis.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/empyralis.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 302 https://empyralis.ai$request_uri;
}

# HTTP → HTTPS redirect for the primary domain
server {
    if ($host = empyralis.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name empyralis.ai;
    return 404; # managed by Certbot
}
