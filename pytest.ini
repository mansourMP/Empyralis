[pytest]
markers =
    blackbox_db: tests that require a reachable Postgres control-plane DATABASE_URL
    kernel: tests that exercise the Rust runtime kernel (requires compiled binary)
    live_provider: tests deliberately allowed to make a real, billed network call to an LLM provider (default is BLOCKED -- see the egress guard in server_modules/tests/conftest.py)
filterwarnings =
    ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning
    error::DeprecationWarning:server_modules\\.
